<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3eb" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg?v=2" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>识谱视奏</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .browser-support-gate {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: linear-gradient(145deg, #f7f3eb, #e5f5f5);
        color: #29251f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .browser-support-card {
        box-sizing: border-box;
        width: min(100%, 560px);
        padding: 32px;
        border: 1px solid #ded2bf;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 50px rgba(61, 52, 39, 0.12);
      }

      .browser-support-card h1 {
        margin: 0 0 12px;
        color: #24786e;
        font-size: 26px;
      }

      .browser-support-card p {
        margin: 12px 0;
        color: #625b50;
        font-size: 16px;
        line-height: 1.7;
      }

      .browser-support-requirements {
        padding: 14px 16px;
        border-radius: 14px;
        background: #edf8f7;
        color: #245f5a !important;
        font-weight: 600;
      }

      .browser-support-card button {
        margin-top: 8px;
        padding: 11px 18px;
        border: 0;
        border-radius: 12px;
        background: #24786e;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .browser-support-card button:focus-visible {
        outline: 3px solid rgba(36, 120, 110, 0.42);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function showStartupFailure(event) {
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0 || root.dataset.startupErrorShown === "true") return;

          root.dataset.startupErrorShown = "true";
          var main = document.createElement("main");
          main.className = "browser-support-gate";
          main.setAttribute("role", "alert");
          var card = document.createElement("section");
          card.className = "browser-support-card";
          var title = document.createElement("h1");
          title.textContent = "页面启动失败";
          var message = document.createElement("p");
          message.textContent = "应用暂时无法启动，可能是入口资源加载失败或启动代码出错。请检查网络后重试。";
          var details = document.createElement("p");
          details.className = "browser-support-requirements";
          if (event instanceof ErrorEvent && event.message) {
            details.textContent = `错误信息：${event.message}`;
          } else {
            details.textContent = "可以重新加载页面再次尝试。";
          }
          var reload = document.createElement("button");
          reload.type = "button";
          reload.textContent = "重新加载页面";
          reload.addEventListener("click", function () {
            window.location.reload();
          });
          card.append(title, message, details, reload);
          main.append(card);
          root.replaceChildren(main);
        }

        window.addEventListener("error", function (event) {
          if (event instanceof ErrorEvent || event.target instanceof HTMLScriptElement) {
            showStartupFailure(event);
          }
        }, true);
        window.addEventListener("unhandledrejection", showStartupFailure);
      })();
    </script>
    <script nomodule>
      (function () {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<main class="browser-support-gate"><section class="browser-support-card"><h1>请升级浏览器后再使用</h1><p>当前浏览器版本过低，无法运行识谱视奏。请更新浏览器或设备系统后重试。</p><p class="browser-support-requirements">最低支持：Chrome / Edge 108、Firefox 101、Safari / iOS 16.4</p></section></main>';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <main class="browser-support-gate">
        <section class="browser-support-card">
          <h1>请启用 JavaScript 后再使用</h1>
          <p>识谱视奏需要 JavaScript。请启用 JavaScript，并使用受支持的新版浏览器。</p>
          <p class="browser-support-requirements">最低支持：Chrome / Edge 108、Firefox 101、Safari / iOS 16.4</p>
        </section>
      </main>
    </noscript>
  </body>
</html>
