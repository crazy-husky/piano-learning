<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3eb" />
    <script>
      (function () {
        try {
          var storedPreferences = JSON.parse(
            window.localStorage.getItem("anki-note.pageAppearancePreferences") || "null"
          );
          var mode = storedPreferences && storedPreferences.mode;
          var isNightMode = mode === "on";

          if (mode === "auto") {
            var isHour = function (value) {
              return Number.isInteger(value) && value >= 0 && value <= 23;
            };
            var startHour = isHour(storedPreferences.startHour) ? storedPreferences.startHour : 19;
            var endHour = isHour(storedPreferences.endHour) ? storedPreferences.endHour : 7;
            var currentHour = new Date().getHours();
            isNightMode =
              startHour === endHour ||
              (startHour < endHour
                ? currentHour >= startHour && currentHour < endHour
                : currentHour >= startHour || currentHour < endHour);
          }

          document.documentElement.dataset.appTheme = isNightMode ? "dark" : "light";
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.content = isNightMode ? "#171b19" : "#f6f1e8";
        } catch (_error) {
          document.documentElement.dataset.appTheme = "light";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="识谱视奏" />
    <title>识谱视奏</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .app-startup {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
        place-items: center;
        background: linear-gradient(145deg, #f7f3eb, #e5f5f5);
        color: #245f5a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-startup-card {
        align-items: center;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(36, 120, 110, 0.14);
        border-radius: 22px;
        box-sizing: border-box;
        box-shadow: 0 12px 36px rgba(36, 95, 90, 0.08);
        display: grid;
        gap: 10px;
        justify-items: center;
        padding: 28px 36px;
        width: min(100%, 380px);
      }

      .app-startup-note {
        align-items: center;
        background: #e4f5f5;
        border: 1px solid #c8e8e8;
        border-radius: 50%;
        color: #258ba0;
        display: grid;
        font-size: 26px;
        height: 52px;
        place-items: center;
        width: 52px;
      }

      .app-startup-card > strong {
        font-size: 20px;
        letter-spacing: 0.04em;
      }

      .app-startup-message {
        color: #6b8589;
        font-size: 14px;
      }

      .app-startup-progress {
        background: #e6eeee;
        border-radius: 999px;
        height: 4px;
        margin-top: 6px;
        overflow: hidden;
        width: 100%;
      }

      .app-startup-progress i {
        animation: app-startup-progress 1.4s ease-in-out infinite;
        background: #35b9ce;
        border-radius: inherit;
        display: block;
        height: 100%;
        transform-origin: left center;
        width: 100%;
      }

      .app-startup-skeleton {
        display: grid;
        gap: 10px;
        margin-top: 8px;
        width: 100%;
      }

      .app-startup-skeleton-choice-row {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .app-startup-skeleton-choice-row i,
      .app-startup-skeleton-panel > i {
        animation: app-startup-shimmer 1.4s ease-in-out infinite;
        background: linear-gradient(
          100deg,
          rgba(36, 120, 110, 0.22) 25%,
          rgba(36, 120, 110, 0.08) 48%,
          rgba(36, 120, 110, 0.22) 72%
        );
        background-size: 220% 100%;
        border-radius: 8px;
        display: block;
      }

      .app-startup-skeleton-choice-row i {
        border: 1px solid rgba(36, 120, 110, 0.12);
        border-radius: 10px;
        height: 36px;
      }

      .app-startup-skeleton-panel {
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(36, 120, 110, 0.16);
        border-radius: 12px;
        display: grid;
        gap: 9px;
        padding: 12px;
      }

      .app-startup-skeleton-panel::before {
        animation: app-startup-shimmer 1.4s ease-in-out infinite;
        background: linear-gradient(
          100deg,
          rgba(36, 120, 110, 0.24) 25%,
          rgba(36, 120, 110, 0.09) 48%,
          rgba(36, 120, 110, 0.24) 72%
        );
        background-size: 220% 100%;
        border-radius: 6px;
        content: "";
        display: block;
        height: 14px;
        width: 38%;
      }

      .app-startup-skeleton-panel > i {
        height: 12px;
        width: 88%;
      }

      .app-startup-skeleton-panel > i:nth-child(2) {
        width: 66%;
      }

      .app-startup-skeleton-panel-short > i:first-child {
        width: 76%;
      }

      .app-startup-skeleton-panel-short > i:nth-child(2) {
        width: 48%;
      }

      @keyframes app-startup-shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -120% 0;
        }
      }

      @keyframes app-startup-progress {
        0% {
          transform: scaleX(0.08);
        }
        55% {
          transform: scaleX(0.72);
        }
        100% {
          transform: scaleX(0.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-startup-progress i,
        .app-startup-skeleton-choice-row i,
        .app-startup-skeleton-panel::before,
        .app-startup-skeleton-panel > i {
          animation: none;
        }

        .app-startup-progress i {
          transform: scaleX(0.6);
        }
      }

      .browser-support-gate {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: linear-gradient(145deg, #f7f3eb, #e5f5f5);
        color: #29251f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .browser-support-card {
        box-sizing: border-box;
        width: min(100%, 560px);
        padding: 32px;
        border: 1px solid #ded2bf;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 50px rgba(61, 52, 39, 0.12);
      }

      .browser-support-card h1 {
        margin: 0 0 12px;
        color: #24786e;
        font-size: 26px;
      }

      .browser-support-card p {
        margin: 12px 0;
        color: #625b50;
        font-size: 16px;
        line-height: 1.7;
      }

      .browser-support-requirements {
        padding: 14px 16px;
        border-radius: 14px;
        background: #edf8f7;
        color: #245f5a !important;
        font-weight: 600;
      }

      .browser-support-card button {
        padding: 11px 18px;
        border: 0;
        border-radius: 12px;
        background: #24786e;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .browser-support-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .browser-support-card .browser-support-clear-cache {
        background: #edf8f7;
        border: 1px solid rgba(36, 120, 110, 0.24);
        color: #245f5a;
      }

      .browser-support-card button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .browser-support-card button:focus-visible {
        outline: 3px solid rgba(36, 120, 110, 0.42);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main
        aria-busy="true"
        aria-label="正在加载应用"
        class="app-startup"
        data-startup-fallback
        role="status"
      >
        <div class="app-startup-card">
          <span aria-hidden="true" class="app-startup-note">♫</span>
          <strong>识谱视奏</strong>
          <span class="app-startup-message">正在准备练习空间</span>
          <div aria-hidden="true" class="app-startup-skeleton">
            <div class="app-startup-skeleton-choice-row"><i></i><i></i><i></i></div>
            <div class="app-startup-skeleton-panel"><i></i><i></i></div>
            <div class="app-startup-skeleton-panel app-startup-skeleton-panel-short">
              <i></i><i></i>
            </div>
          </div>
          <span aria-hidden="true" class="app-startup-progress"><i></i></span>
        </div>
      </main>
    </div>
    <script>
      (function () {
        function showStartupFailure(event) {
          var root = document.getElementById("root");
          if (
            !root ||
            !root.querySelector("[data-startup-fallback]") ||
            root.dataset.startupErrorShown === "true"
          )
            return;

          var reloadAttempted = false;
          try {
            reloadAttempted = window.sessionStorage.getItem("app-startup-reload-attempted") === "1";
          } catch (error) {
            reloadAttempted = true;
          }

          root.dataset.startupErrorShown = "true";
          var main = document.createElement("main");
          main.className = "browser-support-gate";
          main.setAttribute("role", "alert");
          var card = document.createElement("section");
          card.className = "browser-support-card";
          var title = document.createElement("h1");
          title.textContent = "页面启动失败";
          var message = document.createElement("p");
          message.textContent =
            "应用暂时无法启动，可能是入口资源加载失败或启动代码出错。请检查网络后重试。";
          var details = document.createElement("p");
          details.className = "browser-support-requirements";
          if (event instanceof ErrorEvent && event.message) {
            details.textContent = `错误信息：${event.message}`;
          } else {
            details.textContent = "可以重新加载页面再次尝试。";
          }
          if (reloadAttempted) {
            var previousError =
              event instanceof ErrorEvent && event.message ? `（${event.message}）` : "";
            details.textContent = `普通重载后仍未启动${previousError}。可以清理应用离线缓存再试；练习记录和设置会保留。`;
          }
          details.setAttribute("aria-live", "polite");

          var reload = document.createElement("button");
          reload.type = "button";
          reload.textContent = "重新加载页面";
          reload.addEventListener("click", function () {
            reload.disabled = true;
            reload.setAttribute("aria-busy", "true");
            reload.textContent = "正在重新加载…";
            try {
              window.sessionStorage.setItem("app-startup-reload-attempted", "1");
            } catch (error) {
              // The reload still works when session storage is unavailable.
            }
            window.setTimeout(function () {
              window.location.reload();
            }, 60);
          });

          var actions = document.createElement("div");
          actions.className = "browser-support-actions";
          actions.appendChild(reload);

          if (reloadAttempted) {
            var clearCache = document.createElement("button");
            clearCache.className = "browser-support-clear-cache";
            clearCache.type = "button";
            clearCache.textContent = "清理应用缓存并重试";
            clearCache.addEventListener("click", function () {
              clearCache.disabled = true;
              reload.disabled = true;
              clearCache.setAttribute("aria-busy", "true");
              clearCache.textContent = "正在清理应用缓存…";
              details.textContent = "只清理应用离线资源，不会删除练习记录或设置。";

              if (navigator.onLine === false) {
                clearCache.disabled = false;
                reload.disabled = false;
                clearCache.removeAttribute("aria-busy");
                clearCache.textContent = "请联网后清理缓存";
                details.textContent = "清理后需要联网重新加载应用资源；请先连接网络再重试。";
                return;
              }

              var cacheStorage = window.caches;
              if (!cacheStorage || typeof cacheStorage.keys !== "function") {
                clearCache.disabled = false;
                reload.disabled = false;
                reload.removeAttribute("aria-busy");
                clearCache.removeAttribute("aria-busy");
                clearCache.textContent = "清理缓存失败，再试一次";
                details.textContent = "当前浏览器无法清理应用缓存，请检查网络后重试。";
                return;
              }

              cacheStorage
                .keys()
                .then(function (cacheNames) {
                  var appCacheNames = cacheNames.filter(function (cacheName) {
                    return (
                      cacheName.indexOf("anki-note-app-") === 0 ||
                      cacheName === "anki-note-v2" ||
                      cacheName === "anki-note-v3"
                    );
                  });
                  return Promise.all(
                    appCacheNames.map(function (cacheName) {
                      return cacheStorage.delete(cacheName);
                    })
                  );
                })
                .then(function () {
                  reload.textContent = "正在重新加载…";
                  reload.setAttribute("aria-busy", "true");
                  clearCache.textContent = "缓存已清理，正在重新加载…";
                  window.setTimeout(function () {
                    window.location.reload();
                  }, 60);
                })
                .catch(function () {
                  clearCache.disabled = false;
                  reload.disabled = false;
                  reload.removeAttribute("aria-busy");
                  clearCache.removeAttribute("aria-busy");
                  clearCache.textContent = "清理缓存失败，再试一次";
                  details.textContent = "应用缓存清理失败，请检查浏览器存储权限后重试。";
                });
            });
            actions.appendChild(clearCache);
          }

          card.append(title, message, details, actions);
          main.append(card);
          root.replaceChildren(main);
        }

        window.addEventListener(
          "error",
          function (event) {
            if (event instanceof ErrorEvent || event.target instanceof HTMLScriptElement) {
              showStartupFailure(event);
            }
          },
          true
        );
        window.addEventListener("unhandledrejection", showStartupFailure);
      })();
    </script>
    <script nomodule>
      (function () {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<main class="browser-support-gate"><section class="browser-support-card"><h1>请升级浏览器后再使用</h1><p>当前浏览器版本过低，无法运行识谱视奏。请更新浏览器或设备系统后重试。</p><p class="browser-support-requirements">最低支持：Chrome / Edge 108、Firefox 101、Safari / iOS 16.4</p></section></main>';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <main class="browser-support-gate">
        <section class="browser-support-card">
          <h1>请启用 JavaScript 后再使用</h1>
          <p>识谱视奏需要 JavaScript。请启用 JavaScript，并使用受支持的新版浏览器。</p>
          <p class="browser-support-requirements">
            最低支持：Chrome / Edge 108、Firefox 101、Safari / iOS 16.4
          </p>
        </section>
      </main>
    </noscript>
  </body>
</html>
